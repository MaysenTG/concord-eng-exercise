# Build the Vite app and publish it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manual re-publish from Actions → Deploy to GitHub Pages → Run workflow
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run build

      # SPA fallback: deep links like /cases/EMP-1003 reload on Pages.
      - name: Add 404.html for client routes
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages requires Source = "GitHub Actions" (build_type: workflow).
      # If the site was first enabled as "Deploy from a branch", flip it here.
      - name: Ensure Pages uses GitHub Actions
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              await github.request("PUT /repos/{owner}/{repo}/pages", {
                owner,
                repo,
                build_type: "workflow",
              });
              core.info("Pages build_type set to workflow");
            } catch (error) {
              core.warning(
                `Could not set Pages build_type to workflow (${error.status || "?"} ${error.message}). ` +
                  "If deploy fails with 404, set Source to GitHub Actions at " +
                  `https://github.com/${owner}/${repo}/settings/pages`,
              );
            }

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
