# Build the Vite app and publish to GitHub Pages.
#
# Recommended repo setting (Settings → Pages → Build and deployment):
#   Source: Deploy from a branch → gh-pages / (root)
#
# Also publishes via GitHub Actions if you switch Source to "GitHub Actions".
# Do NOT use branch "main" / (root) — that serves dev index.html and breaks with
#   https://<user>.github.io/src/main.tsx (HTML MIME type error).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run build

      # SPA fallback: deep links like /cases/EMP-1003 reload on Pages.
      - name: Add 404.html for client routes
        run: cp dist/index.html dist/404.html

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
