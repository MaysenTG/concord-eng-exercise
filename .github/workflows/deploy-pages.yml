# Build the Vite app and publish it to the gh-pages branch on every push to main.
# Repo Pages settings must use Source: Deploy from a branch → gh-pages / (root).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manual re-publish from Actions → Deploy to GitHub Pages → Run workflow
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run build

      # SPA fallback: deep links like /cases/EMP-1003 reload on Pages.
      - name: Add 404.html for client routes
        run: cp dist/index.html dist/404.html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
